# Preview deployment of the ORIGINAL application, not the Clauseora repository.
services:
  - type: web
    name: nyayasarathi-preview
    runtime: docker
    plan: free
    autoDeployTrigger: "off"
    healthCheckPath: /api/v1/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: INFERENCE_MODE
        value: hosted
